# ci — PRs and pushes. Fail-fast lint (zero secrets, fork-safe) then the real
# knowledge check: claim -> load -> lint on the EXACT engine pinned in
# envs/staging/values.yaml (now ghcr.io/nausikt/archi-crab-okg = okg + archi).
name: ci
on:
  pull_request:
  push: {branches: [main]}
permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: step-security/harden-runner@v2
        with: {egress-policy: audit}
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Placeholder guards
        run: |
          set -e
          ! grep -rn "REPLACE_ME" envs/ okg/archi-crab/deployment.yaml || { echo "::error::REPLACE_ME placeholders remain"; exit 1; }
          test -f okg/archi-crab/extractors.yaml || { echo "::error::okg/archi-crab/extractors.yaml missing (vendor-sync --apply)"; exit 1; }
          test -f okg/archi-crab/schemas/bridges/extraction_to_git_files.yaml || { echo "::error::code-graph bridge missing (vendor-sync --apply)"; exit 1; }
          test -f okg/archi-crab/VENDOR.yaml || { echo "::error::okg/archi-crab/VENDOR.yaml missing"; exit 1; }
      - run: pip install --quiet yamllint && yamllint -c .yamllint.yaml okg envs helm/okg/values.yaml
      - run: helm lint helm/okg -f envs/staging/values.yaml --set repositorySync.revision=x --set bootstrap.approvedRevision=x
      - run: helm lint helm/okg -f envs/prod/values.yaml    --set repositorySync.revision=x --set bootstrap.approvedRevision=x
      - name: kubeconform (both envs)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          for e in staging prod; do
            helm template t helm/okg -f envs/$e/values.yaml \
              --set repositorySync.revision=${{ github.sha }} \
              --set bootstrap.approvedRevision=${{ github.sha }} \
            | ./kubeconform -strict -summary -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  pins:
    needs: lint
    runs-on: ubuntu-latest
    permissions: {contents: read}
    outputs:
      okg: ${{ steps.p.outputs.okg }}
      pg: ${{ steps.p.outputs.pg }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        run: |
          echo "okg=$(yq '.images.okg.repository + "@" + .images.okg.digest' envs/staging/values.yaml)" >> "$GITHUB_OUTPUT"
          echo "pg=$(yq '.postgresql.image.repository + "@" + .postgresql.image.digest' envs/staging/values.yaml)" >> "$GITHUB_OUTPUT"

  vendor-check:
    # Vendored vocabulary must be byte-identical to the PINNED image's sources
    # (okg/archi-crab/VENDOR.yaml). Drift => this PR forgot `vendor-sync.sh --apply`
    # after an engine/archi bump, or someone hand-edited a vendored file.
    needs: pins
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: nausikt, password: "${{ secrets.GHCR_PAT }}"}
      - run: IMG="${{ needs.pins.outputs.okg }}" CONTAINER_RUNTIME=docker scripts/vendor-sync.sh --check

  okg-validate:
    needs: pins
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # Host-run, NOT a `container:` job: the okg image runs as uid 10001, which
    # cannot write the runner's workspace (checkout EACCES -> every step skipped),
    # and a `services:` Postgres cannot take the chart's command args.
    runs-on: ubuntu-latest
    permissions: {contents: read}
    env:
      OKG_IMG: ${{ needs.pins.outputs.okg }}
      PG_IMG: ${{ needs.pins.outputs.pg }}
      OKG_DSN: postgresql://postgres:ci@127.0.0.1:5432/okg
      OKG_DEPLOYMENTS_DIR: ${{ github.workspace }}/okg
      OKG_ENVIRONMENT_DATA_ROOT: ${{ github.workspace }}/.okg-data
      ARCHI_DATA_ROOT: ${{ github.workspace }}/.okg-data     # archi connectors resolve relative data/ here
    steps:
      - uses: actions/checkout@v7
      - name: ghcr login (CLI; no additional action)
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u nausikt --password-stdin
      - name: Postgres with the chart's exact args
        run: |
          docker run -d --name pg --network host --shm-size 2g \
            -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=okg "$PG_IMG" \
            postgres -c shared_preload_libraries=timescaledb,pg_textsearch -c max_locks_per_transaction=1024
          for i in $(seq 1 60); do docker exec pg pg_isready -U postgres -d okg >/dev/null 2>&1 && break || sleep 2; done
          # Fresh database on the okg-postgres image: only timescaledb is installed by
          # initdb. okg migrate CHECKS the rest and refuses (extension_missing) — same
          # as bundle README step 4. Create them once, idempotently.
          docker exec pg psql -v ON_ERROR_STOP=1 -U postgres -d okg \
            -c "CREATE EXTENSION IF NOT EXISTS btree_gist" \
            -c "CREATE EXTENSION IF NOT EXISTS fuzzystrmatch" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_textsearch" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm" \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb" \
            -c "CREATE EXTENSION IF NOT EXISTS vector"
          docker exec pg psql -U postgres -d okg -c "SELECT extname, extversion FROM pg_extension ORDER BY 1"
      - name: okg wrapper (runs as the runner uid so workspace files stay writable)
        run: |
          mkdir -p "$OKG_ENVIRONMENT_DATA_ROOT" .okg-home .bin
          cat > .bin/okg <<'EOF'
          #!/usr/bin/env bash
          exec docker run --rm --network host --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" -e HOME="$GITHUB_WORKSPACE/.okg-home" \
            -e OKG_DSN -e OKG_DEPLOYMENTS_DIR -e OKG_ENVIRONMENT_DATA_ROOT -e ARCHI_DATA_ROOT \
            --entrypoint okg "$OKG_IMG" "$@"
          EOF
          chmod +x .bin/okg && echo "$GITHUB_WORKSPACE/.bin" >> "$GITHUB_PATH"
      - run: okg migrate --deployment archi-crab --apply
      - run: okg migrate --deployment archi-crab --apply       # idempotent_second_run
      - run: okg catalog ownership claim --deployment "$OKG_DEPLOYMENTS_DIR/archi-crab"
      - run: okg catalog load --deployment "$OKG_DEPLOYMENTS_DIR/archi-crab" --apply
      - run: |
          okg deployment lint archi-crab --json | tee lint.json
          python3 -c "import json,sys; sys.exit(0 if json.load(open('lint.json'))['ok'] else 1)"
      - if: always()
        run: docker logs pg --tail 40
