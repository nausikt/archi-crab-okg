# archi-crab — OKG deployment manifest (MVP v0.5.0)
#
# Hand-authored from the cern-team bundle's deployment-defaults.yaml and the
# CMS CompOps field guide. Key names for the scaffolder-owned block (name,
# description, modules, source_registry, schema_dir, postgres) follow the
# bundle's documented reserved keys; `okg deployment lint archi-crab` is the
# arbiter — reconcile anything it flags (Runbook Phase 2, step 6).

name: archi-crab
description: >-
  CRAB knowledge graph — CRABServer + CRABClient code graphs and the public CMSSW release catalog. Minimal-workable MVP; every addition is a PR.
source_registry: source_registry.yaml
schema_dir: schemas
postgres:
  # Interpolated at command time from the environment; never written to disk.
  dsn: ${OKG_DSN}
  database: okg
# Release authority: the deployment dir MUST be a git checkout (repositorySync
# provides one) and, because okg is pip-installed in the runtime image, the
# code repository must be pinned here.
release:
  channel: dev
# Base five + ALL SEVEN code modules, together. Adding the seven incrementally
# cascades (~618k transform_consistency_violations at publish, field guide §5).
modules:
  - document_starter
  - person
  - extraction
  - dataset
  - repo_starter
  - git_graph
  - openspec
  - agent_sessions
  - compute_env
  - code_graph
  - forge
  - ci
# Code graphs always emit unresolvable forward references (~100+ dangling
# edges). Pruning them is safe: narrowing violations still block a publish.
consistency:
  dangling_edges: prune
# The Helm chart runs an always-on worker container — declare the truth.
runtime:
  enabled: true
# Nomos is okg's access-policy layer. Because this manifest has a `nomos:` block, okg
# audits it on every readiness probe (check `nomos.deployment_policy`): without a
# posture, and a policy for every entry under `sources:` in the registry, the worker
# never becomes Ready.
#
# The posture DECLARES what this graph holds. Today that is public material only: two
# public GitHub repositories and the public CMSSW release map, ingested without any
# credential. `public_reference_demo` is okg's class for exactly that, and the only one
# that does not require Nomos runtime enforcement.
#
# THIS IS A GATE, ON PURPOSE. The first source that is not public (CMS-internal TWiki,
# a private repository, anything read with a token or an SSO cookie) fails the audit
# until the class becomes `org_operational_private`, and okg accepts that class only
# with runtime enforcement switched on (the rollout below). Do not widen the lists
# here to make such a source pass.
nomos:
  deployment_posture:
    deployment_class: public_reference_demo
    read_principals: [human_operator, okg_service, mcp_client]
    write_principals: [okg_service, source_adapter]
    mcp_write_default: deny # the MCP surface is read-only
    export_policy: public_allowed
    secret_handling: no_secrets # no SOURCE carries or needs a secret
    live_call_default: deny
    allowed_source_sensitivities: [public]
    allowed_data_classifications: [public]
    allowed_exportability: [public]
    privacy_obligations: [audit]
    # Readiness profiles that must prove enforcement is ON. `general`, the chart's
    # probe, is deliberately absent while enforcement is off.
    readiness_profiles: [production]
  # One policy per source class used under `sources:`. A source of a class not listed
  # here fails the audit until its policy is written down.
  source_policy_defaults:
    by_source_class:
      # cmssw_releases: the public releases.map, downloaded at ingest and cached. It is
      # not a live-overlay or mutable-API source, which is what okg means by a live call.
      reference_catalog:
        sensitivity: public
        data_classification: public
        credential_ref_policy: none
        live_call_allowed: false
        exportability: public
        retention: normal
        provenance: remote_api
        privacy_obligations: [audit]
  # Rollout audit requires owner.name + owner.contact + review_by.
  rollout:
    status: deferred
    owner:
      name: archi-crab
      contact: krittin.phornsiricharoenphant@cern.ch
    review_by: "2027-03-01"
skills_dir: skills
skill_triggers: skills/skill-triggers.yaml
# Search scope: only subtypes THIS registry produces. okg refuses a profile
# naming a subtype the catalog lacks — do not add subtypes speculatively.
search:
  default_profile: content
  profiles:
    content:
      description: Code files, symbols, doc chunks and CMSSW releases — what a CRAB question is asked about.
      subtypes:
        - document_chunk
        - source_file
        - code_symbol
        - cmssw_release
# Chat is an Open WebUI Application in CMSKubernetes, fronted by the vMCP.
# okg's own chat-instance machinery is not used on this deployment.
chat:
  enabled: false
