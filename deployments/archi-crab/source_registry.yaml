# kind git: a git repository, ingested as a code graph (files, symbols, interfaces, doc chunks).
# Proven: staging since v0.5 (crabserver, crabclient), public GitHub only.
code_repos:
  base: ${OKG_ENVIRONMENT_DATA_ROOT}/repos
  expand: [git-files, code-structure, interfaces, doc-corpus]
  repos:
    # crabserver -- tier 10 -- CRAB REST interface, TaskWorker, Publisher, CI/CD scripts
    - {slug: crabserver, url: 'https://github.com/dmwm/CRABServer.git', dir: CRABServer}
    # crabclient -- tier 10 -- CRAB command-line client (crab submit/status/resubmit/getoutput ...)
    - {slug: crabclient, url: 'https://github.com/dmwm/CRABClient.git', dir: CRABClient}

sources:
  # ---- cmssw-releases -- tier 10 -- kind cmssw-releases -- CMSSW release catalog (cms-bot releases.map, public)
  # The ADAPTER, not the bare reader (a bare reader crashes okg's runner:
  # 'ConnectorRun' has no 'next_cursor'). reference_catalog admits only
  # domain_key. NO `limit`: a truncating cap forfeits the completed-scope
  # claim on every run and disables retraction forever.
  cmssw_releases:
    module: archi.sources.cmssw
    class: CMSSWReleaseAdapter
    ownership_id: archi-crab.cmssw-releases
    admission_policy:
      producer_id: archi-crab.cmssw-releases
      producer_kind: source
      trust_label: implicit_legacy_trusted
      admission_mode: fast_track
      authority_scope: {source_family: archi-crab, source_name: cmssw_releases}
      output_signature:
        nodes:
          - {subtype: cmssw_release}
        edges:
          - {src_subtype: cmssw_release, edge_type: supersedes, dst_subtype: cmssw_release}
      output_scope_summary:
        summary: CMSSW releases, release families, and supersedes chains
        nodes: [cmssw_release]
        edges: [cmssw_release supersedes cmssw_release]
    source_class: reference_catalog
    record_identity_kind: domain_key
    record_identity_fields: [release]
    source_revision_kind: content_hash
    deletion_semantics: missing_from_completed_scope
    publication_mode: published_generation
    required_for_baseline: true
    params:
      map_cache_path: ${OKG_ENVIRONMENT_DATA_ROOT}/cmssw-releases/releases.map
      releases_map_url: https://raw.githubusercontent.com/cms-sw/cms-bot/master/releases.map
      fetch: true
    sync:
      triggers: [manual, reconcile]
      default_event_mode: scope_complete
      reconcile_mode: scope_complete
