{{- if eq .Values.mcp.mode "toolhive" }}
{{- /*
toolhive mode (ADR-V2-3/5): per tool family, its OWN MCPGroup (the trust boundary), one
ToolHive MCPServer running our mcp image, one VirtualMCPServer in front with CERN SSO
(incomingAuth oidc; audience = the public CERN client), one HTTPRoute on the shared Gateway.
Modelled on the crab-mcp-gateway chart (CMSKubernetes, archi-crab-testbed): same operator
quirks apply (oidcConfigRef required; backends map pinned to type: discovered; the operator
names the vMCP Service vmcp-<name> on 4483). The MCP container runs anonymous: the vMCP is the
only gate (as backendAuth.enabled: false there), the NetworkPolicy is what keeps anything but
ToolHive's proxies from reaching it.
*/ -}}
{{- $full := include "archi-v2.fullname" . -}}
{{- $secret := .Values.secrets.existingSecret -}}
{{- $audience := required "cern.audience is required in toolhive mode (the public CERN client, e.g. crab-mcp-gateway-public-staging)" .Values.cern.audience -}}
{{- range $family := list "grep" "vector" }}
{{- $m := index $.Values.mcp $family }}
{{- if $m.enabled }}
{{- $name := printf "%s-%s" $full $family }}
{{- $host := required (printf "mcp.%s.host is required in toolhive mode" $family) $m.host }}
---
# The trust boundary: one family, one audience, one vMCP. Nothing else joins it.
apiVersion: {{ $.Values.toolhive.apiVersions.mcpGroup }}
kind: MCPGroup
metadata:
  name: {{ $name }}
  annotations: {argocd.argoproj.io/sync-wave: "1"}
  labels:
    {{- include "archi-v2.labels" $ | nindent 4 }}
    archi-crab.cern.ch/v2-mcp: {{ $family }}
---
apiVersion: {{ $.Values.toolhive.apiVersions.mcpOIDCConfig }}
kind: MCPOIDCConfig
metadata:
  name: {{ $full }}-cern-{{ $family }}
  annotations: {argocd.argoproj.io/sync-wave: "1"}
  labels:
    {{- include "archi-v2.labels" $ | nindent 4 }}
    archi-crab.cern.ch/v2-mcp: {{ $family }}
spec:
  type: inline
  inline:
    issuer: {{ $.Values.cern.issuer | quote }}
    jwksUrl: {{ $.Values.cern.jwksUri | quote }}
    clientId: {{ $audience | quote }}
---
# The backend: our mcp image, one family. NO host, NO HTTPRoute of its own.
apiVersion: {{ $.Values.toolhive.apiVersions.mcpServer }}
kind: MCPServer
metadata:
  name: {{ $name }}
  annotations: {argocd.argoproj.io/sync-wave: "2"}
  labels:
    {{- include "archi-v2.labels" $ | nindent 4 }}
    archi-crab.cern.ch/v2-mcp: {{ $family }}
    toolhive.stacklok.dev/group: {{ $name }}
spec:
  groupRef:
    name: {{ $name }}
  image: {{ include "archi-v2.image" $.Values.images.mcp | quote }}
  transport: streamable-http
  mcpPort: {{ $m.port }}
  proxyPort: {{ $m.port }}
  trustProxyHeaders: {{ $.Values.toolhive.trustProxyHeaders }}
  resources:
    {{- toYaml $.Values.toolhive.proxyResources | nindent 4 }}
  podTemplateSpec:
    metadata:
      labels:
        archi-crab.cern.ch/v2-mcp: {{ $family }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp
          env:
            - {name: V2_MCP_FAMILY, value: {{ $family | quote }}}
            - {name: V2_MCP_PORT, value: {{ $m.port | quote }}}
            - {name: V2_MCP_FETCH, value: {{ $m.fetch | ternary "1" "0" | quote }}}
            {{- with $m.tools }}
            - {name: V2_MCP_TOOLS, value: {{ . | quote }}}
            {{- end }}
            - {name: V2_MCP_LOG_LEVEL, value: {{ $.Values.mcp.logLevel | quote }}}
            - {name: HF_HUB_OFFLINE, value: {{ $.Values.mcp.hfHubOffline | ternary "1" "0" | quote }}}
            # the vMCP is the only gate (see the file comment); the proxy forwards the CERN token,
            # which is not our static bearer
            - {name: V2_MCP_ALLOW_ANONYMOUS, value: "1"}
            - {name: DM_BASE_URL, value: "http://{{ $full }}-data-manager:{{ $.Values.dataManager.port }}"}
            {{- include "archi-v2.secretEnv" (dict "secret" $secret "key" "DM_API_TOKEN") | nindent 12 }}
            {{- if eq $family "vector" }}
            {{- include "archi-v2.pgEnv" $ | nindent 12 }}
            {{- include "archi-v2.secretEnv" (dict "secret" $secret "key" "OPENAI_API_KEY" "optional" true) | nindent 12 }}
            {{- include "archi-v2.secretEnv" (dict "secret" $secret "key" "HUGGING_FACE_HUB_TOKEN" "optional" true) | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          volumeMounts:
            - {name: scratch-tmp, mountPath: /tmp}
      volumes:
        - {name: scratch-tmp, emptyDir: {}}
---
apiVersion: {{ $.Values.toolhive.apiVersions.virtualMCPServer }}
kind: VirtualMCPServer
metadata:
  name: {{ $name }}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
  labels:
    {{- include "archi-v2.labels" $ | nindent 4 }}
    archi-crab.cern.ch/v2-mcp: {{ $family }}
spec:
  groupRef:
    name: {{ $name }}
  incomingAuth:
    type: oidc
    oidcConfigRef:
      name: {{ $full }}-cern-{{ $family }}
      audience: {{ $audience | quote }}
      # advertised in OAuth discovery; bare :443 through the Octavia LB
      resourceUrl: "https://{{ $host }}/mcp"
  outgoingAuth:
    source: discovered
    backends:
      {{ $name }}:
        type: discovered
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  annotations: {argocd.argoproj.io/sync-wave: "4"}
  labels:
    {{- include "archi-v2.labels" $ | nindent 4 }}
    archi-crab.cern.ch/v2-mcp: {{ $family }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
      namespace: {{ $.Values.gateway.namespace }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - backendRefs:
        - name: vmcp-{{ $name }}
          port: {{ $.Values.toolhive.vmcpServicePort }}
      timeouts:
        backendRequest: {{ $.Values.gateway.timeout }}
        request: {{ $.Values.gateway.timeout }}
{{- end }}
{{- end }}
{{- end }}
