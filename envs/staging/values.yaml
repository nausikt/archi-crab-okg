# envs/staging — overrides only. Namespace: archi-crab-staging (set on the Argo CD Application).
#
# Two kinds of pins:
#   ENGINE    images.okg.digest / postgresql.image.digest
#             -> human "engine bump" PR (edit here + versions.lock together;
#                CI reads THIS file to pick its own container images)
#   KNOWLEDGE repositorySync.revision / bootstrap.approvedRevision
#             -> auto-bumped by main.yaml on every green build

images:
  okg:
    repository: ghcr.io/nausikt/archi-crab-okg
    tag: ""
    digest: "sha256:5922753c73f2e3873522260aa7d8c0458dd8adbdf6216fc6e13d7745a32d362c"
    pullPolicy: IfNotPresent
postgresql:
  image:
    repository: ghcr.io/mitdbg/okg-postgres
    tag: ""
    digest: "sha256:75845f96d973859c248f0f6741cb0a06445e9d312e563de7a39c5e25f3236616"
    pullPolicy: IfNotPresent
  storage:
    size: 30Gi
    storageClassName: cinder-standard # real StorageClass on the target cluster (Runbook Phase 2)
runtime:
  storage:
    size: 20Gi
    storageClassName: cinder-standard
repositorySync:
  revision: "0fb4e6383e34446287b54c715fbd2b1c5835ee98" # <- merge sha (staging: CI bot; prod: Promote PR)
bootstrap:
  approvedRevision: "0fb4e6383e34446287b54c715fbd2b1c5835ee98" # <- MUST equal repositorySync.revision (chart enforces)
