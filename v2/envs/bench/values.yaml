# v2/envs/bench -- the ONE environment the archi-v2 fixture runs in (namespace archi-crab-staging,
# next to the okg staging instance and the ToolHive operator). Overrides only.
# The three image lines are written by the bot (v2-main.yaml) after a green smoke on main,
# from v2/versions.lock; by hand only in runbook phase 2. Never a tag.
images:
  dataManager: {repository: ghcr.io/nausikt/archi-v2-data-manager, digest: "sha256:2a2dca78e188283988619e627743789d4dca246923fb171f5b333241bfaaed35"} # <- bot
  mcp: {repository: ghcr.io/nausikt/archi-v2-mcp, digest: "sha256:c92c5a8bd4dfb865e5a5b14f8faf4fc880189c3613cfff2f3ee6303bc25e00a7"} # <- bot
  postgres: {repository: ghcr.io/nausikt/archi-v2-postgres, digest: "sha256:cae2829b4ecb34381010b5b5b7e78dc16353acc04895d0f4152174c1dc67abc7"} # <- bot
secrets:
  existingSecret: archi-v2 # kubectl -n archi-crab-staging create secret generic archi-v2 ... (runbook 2.2)
postgres:
  storage: {size: 150Gi, storageClassName: cinder-io1-delete} # = okg staging postgres (150Gi): same disk budget for the comparison
dataManager:
  storage: {size: 75Gi, storageClassName: cinder-io1-delete} # = okg staging runtime (75Gi)
mcp:
  # phase 2: bearer (port-forward smoke). Phase 4 flips this ONE line to `none`, in the same
  # change that enables the v2-grep / v2-vector MCPRemoteProxies in CMSKubernetes: from then on
  # https://archi-crab-v2.cern.ch/{grep,vectorstore}/mcp (CERN SSO) is the only way in.
  auth: bearer
