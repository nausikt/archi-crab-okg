# GENERATED by scripts/sources.py render -- do not edit.
# Inputs: sources/archi-crab.yaml (what) + sources/kinds.yaml (how).
# Change a source there, then: python3 scripts/sources.py render --write
# CI (workflow `sources`) fails when this file differs from the render.
#
# Enabled tiers: [10, 20]. Kinds reviewed against archi 1bb7e703, okg 0a8e0cd4.
# Not rendered (`python3 scripts/sources.py status` says why):
#   cms-analysis-docs (enabled: false), twiki (enabled: false), crab-mcp (enabled: false)
#   dbs-mcp (enabled: false), htcondor-mcp (enabled: false), rucio-mcp (enabled: false)
#   site-status-mcp (enabled: false), cmssw (tier 30 not enabled)
#   cms-sw-github-io (tier 30 not enabled), htcondor (tier 30 not enabled).

# kind git: a git repository, ingested as a code graph (files, symbols, interfaces, doc chunks).
# Proven: staging since v0.5 (crabserver, crabclient), public GitHub only.
code_repos:
  base: ${OKG_ENVIRONMENT_DATA_ROOT}/repos
  expand: [git-files, code-structure, interfaces, doc-corpus]
  repos:
    # crabserver -- tier 10 -- CRAB REST interface, TaskWorker, Publisher, CI/CD scripts
    - {slug: crabserver, url: 'https://github.com/dmwm/CRABServer.git', dir: CRABServer}
    # crabclient -- tier 10 -- CRAB command-line client (crab submit/status/resubmit/getoutput ...)
    - {slug: crabclient, url: 'https://github.com/dmwm/CRABClient.git', dir: CRABClient}
    # cms-crab-docs -- tier 10 -- CRAB documentation site sources
    - {slug: cms-crab-docs, url: 'https://gitlab.cern.ch/crab3/cms-crab-docs.git', dir: cms-crab-docs}
    # cmscrab-userguide -- tier 10 -- CRAB user guide
    - {slug: cmscrab-userguide, url: 'https://gitlab.cern.ch/crab3/cmscrab-userguide.git', dir: cmscrab-userguide}
    # das2go -- tier 20 -- DAS server (Go)
    - {slug: das2go, url: 'https://github.com/dmwm/das2go.git', dir: das2go}
    # dasgoclient -- tier 20 -- dasgoclient, the DAS command-line client
    - {slug: dasgoclient, url: 'https://github.com/dmwm/dasgoclient.git', dir: dasgoclient}
    # dbsclient -- tier 20 -- DBS3 Python client
    - {slug: dbsclient, url: 'https://github.com/dmwm/DBSClient.git', dir: DBSClient}
    # rucio -- tier 20 -- Rucio (server, client, daemons); 952 files unscoped
    - {slug: rucio, url: 'https://github.com/rucio/rucio.git', dir: rucio}
    # wmcore -- tier 20 -- WMCore libraries CRAB runs on; WMExceptions.py holds the WM exit codes
    - {slug: wmcore, url: 'https://github.com/dmwm/WMCore.git', dir: WMCore}
    # monitoringscripts -- tier 20 -- CMS Computing Operations monitoring scripts (site readiness, SAM, metrics)
    - {slug: monitoringscripts, url: 'https://github.com/CMSCompOps/MonitoringScripts.git', dir: MonitoringScripts}
    # lpc-scripts -- tier 20 -- FNAL LPC user helper scripts (condor submission, EOS, environment)
    - {slug: lpc-scripts, url: 'https://github.com/FNALLPC/lpc-scripts.git', dir: lpc-scripts}
    # fts3 -- tier 20 -- FTS3 file transfer service (the transfers behind Rucio and CRAB stageout)
    - {slug: fts3, url: 'https://github.com/cern-fts/fts3.git', dir: fts3}
    # dbs -- tier 20 -- DBS3 server (Python), the dataset bookkeeping service
    - {slug: dbs, url: 'https://github.com/dmwm/DBS.git', dir: DBS}
    # dbs2go -- tier 20 -- DBS server in Go (the current production DBS)
    - {slug: dbs2go, url: 'https://github.com/dmwm/dbs2go.git', dir: dbs2go}
    # cmsmonitoring -- tier 20 -- CMS monitoring infrastructure (MONIT, dashboards, CRAB/WMAgent metrics)
    - {slug: cmsmonitoring, url: 'https://github.com/dmwm/CMSMonitoring.git', dir: CMSMonitoring}
    # crabserver-wiki -- tier 20 -- CRABServer GitHub wiki -- developer and operator notes not in the code or the TWiki
    - {slug: crabserver-wiki, url: 'https://github.com/dmwm/CRABServer.wiki.git', dir: CRABServer.wiki}
    # wmcore-wiki -- tier 20 -- WMCore GitHub wiki -- WMAgent operations, error handling, background of the WM exit codes
    - {slug: wmcore-wiki, url: 'https://github.com/dmwm/WMCore.wiki.git', dir: WMCore.wiki}
    # rucio-docs -- tier 20 -- Rucio user and operator documentation ("how do I"; the rucio repo is "where in the code")
    - {slug: rucio-docs, url: 'https://github.com/rucio/documentation.git', dir: rucio-documentation}
    # cms-docker -- tier 20 -- cms-sw container images (cmssw-el7/el8/el9 Dockerfiles, locale and tool choices behind "command not found" in a container)
    - {slug: cms-docker, url: 'https://github.com/cms-sw/cms-docker.git', dir: cms-docker}
    # cmssw-osenv -- tier 20 -- the cmssw-env wrapper behind cmssw-el7/el8/el9 (apptainer, bind mounts, LC_ALL, --command-to-run)
    - {slug: cmssw-osenv, url: 'https://github.com/cms-sw/cmssw-osenv.git', dir: cmssw-osenv}
    # cmssw-wm-tools -- tier 20 -- edm_pset_tweak and the other scripts WMCore/CRAB use to rewrite a PSet at runtime
    - {slug: cmssw-wm-tools, url: 'https://github.com/cms-sw/cmssw-wm-tools.git', dir: cmssw-wm-tools}
    # nanoaod-tools -- tier 20 -- NanoAODTools post-processor (crab/ example, crabhelper.py, fwkJobReport handling)
    - {slug: nanoaod-tools, url: 'https://github.com/cms-nanoAOD/nanoAOD-tools.git', dir: nanoAOD-tools}
    # cms-cat-cmssw-lxplus -- tier 20 -- cms-cat/cmssw-lxplus -- running CMSSW on lxplus9 for pre-el9 releases
    - {slug: cms-cat-cmssw-lxplus, url: 'https://gitlab.cern.ch/cms-cat/cmssw-lxplus.git', dir: cmssw-lxplus}

sources:
  # ---- twiki-sanitized -- tier 10 -- kind docs-files -- Sanitized CRAB-relevant TWiki pages (Markdown/HTML/PDF -> one records file)
  # Built by scripts/docs-build.py from a folder of files; committed, and
  # delivered to the pod by repositorySync with the rest of the deployment.
  # Node ids are documentation_page:<sha256(url)[:16]>: a page keeps its id
  # as long as its URL does. No reference params (releases_map_path, ...):
  # a configured reference file that is missing at run time raises, and
  # cmssw-releases writes its map during the same bootstrap.
  twiki_sanitized:
    module: archi.sources.docs
    class: DocumentationAdapter
    ownership_id: archi-crab.twiki-sanitized
    admission_policy:
      producer_id: archi-crab.twiki-sanitized
      producer_kind: source
      trust_label: implicit_legacy_trusted
      admission_mode: fast_track
      authority_scope: {source_family: archi-crab, source_name: twiki_sanitized}
      output_signature:
        nodes:
          - {subtype: documentation_page}
          - {subtype: document_chunk}
        edges:
          - {src_subtype: documentation_page, edge_type: contains, dst_subtype: document_chunk}
      output_scope_summary:
        summary: pages of twiki-sanitized (records.json built from files) and their text chunks
        nodes: [documentation_page, document_chunk]
        edges: [documentation_page contains document_chunk]
    source_class: discovery_crawl
    record_identity_kind: scoped_locator
    record_identity_fields: [url]
    source_revision_kind: content_hash
    deletion_semantics: missing_from_completed_scope
    publication_mode: published_generation
    required_for_baseline: false
    params:
      required: true
      records_path: ${OKG_DEPLOYMENTS_DIR}/archi-crab/data/docs/twiki-sanitized/records.json
    sync:
      triggers: [manual, reconcile]
      default_event_mode: scope_complete
      reconcile_mode: scope_complete

