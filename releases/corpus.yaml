# releases/corpus.yaml — the CORPUS axis of a release: what is ingested.
#
# A corpus is the engine-independent part of the source of truth, `paths` below:
#   sources/archi-crab.yaml        which sources, tiers, scopes (the one file people edit)
#   deployments/archi-crab/data/   data shipped in this repository (sanitized TWiki records)
# Not part of it, because they change with the ENGINE: sources/kinds.yaml (how a kind becomes
# okg registry YAML), deployments/archi-crab/{deployment,extractors,invariants}.yaml, schemas/,
# skills/. The renders in `derived` come from corpus + kinds.yaml.
#
# A corpus release is an annotated git tag corpus/<version> on a commit whose `paths` hash to
# `fingerprint` (scripts/release.py fingerprint <rev>). An instance serves corpus X when its
# repositorySync.revision has the same fingerprint, so an instance may be built from ANY commit
# that carries those files, e.g. a newer engine's adapter with an older corpus.
#
# A tag pins the LIST of sources, not the bytes behind them. Git sources are cloned at their
# branch HEAD and v2 fetches TWiki pages live when an instance is BUILT. `materialized` records
# what each instance actually holds, and it is fixed only once that instance is frozen.
#
#   status   pending   being assembled (sources list + docs not dropped in yet)
#            released  tag cut, fingerprint fixed: never edit `paths` content under it again
version: 1

paths:
  - sources/archi-crab.yaml
  - deployments/archi-crab/data

derived:
  - deployments/archi-crab/source_registry.yaml
  - v2/helm/archi-v2/files/weblists/archi-crab.list

