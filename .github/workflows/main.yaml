# main — after merge. Runs the full e2e again on main (e2e.yaml), and only when it is
# green does the bot pin staging: the IMAGE and the KNOWLEDGE REVISION, in one commit.
# Argo CD follows envs/staging on main, so staging never runs a new image with an old
# registry or the reverse, and no Argo pause is needed around an engine bump.
name: main
on:
  push:
    branches: [main]
    paths: [deployments/**, helm/**, scripts/**, envs/**, versions.lock, .github/workflows/main.yaml, .github/workflows/e2e.yaml]
  workflow_dispatch: {}
permissions: {}
concurrency: {group: main, cancel-in-progress: false}
defaults:
  run:
    shell: bash # explicit: GitHub then runs bash with -eo pipefail
jobs:
  e2e:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions: {contents: read}
    uses: ./.github/workflows/e2e.yaml
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
  bump-staging:
    needs: e2e
    # Only main is ever pinned: a manual run on another branch proves it and stops here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Pin what was just proven (image + knowledge revision, one commit)
        env:
          GH_TOKEN: ${{ secrets.STAGING_BUMP_TOKEN }}
        run: |
          # Read the pins from the TESTED tree (this sha), then write them onto main's tip:
          # main may have moved while the e2e ran, and the pair must stay the tested pair.
          IMG_REPO="$(yq -r '.runtime.ref' versions.lock)"
          IMG_DIGEST="$(yq -r '.runtime.digest' versions.lock)"
          PG_REF="$(yq -r '.images["okg-postgres"].ref' versions.lock)"
          PG_REPO="${PG_REF%@*}"; PG_DIGEST="${PG_REF#*@}"
          [[ "$IMG_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$PG_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::versions.lock has no usable image digests"; exit 1; }
          export IMG_REPO IMG_DIGEST PG_REPO PG_DIGEST REV="$GITHUB_SHA"
          git config user.name archi-crab-bot
          git config user.email archi-crab-bot@users.noreply.github.com
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"; echo "::add-mask::$basic"
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          agit() { git -c "http.${remote}.extraheader=Authorization: Basic $basic" "$@"; } # the checkout keeps no credential
          for attempt in 1 2 3; do
            agit fetch -q "$remote" "+refs/heads/main:refs/remotes/origin/main"
            git checkout -q -B main origin/main
            yq -i '.images.okg.repository = strenv(IMG_REPO)
                 | .images.okg.digest = strenv(IMG_DIGEST)
                 | .postgresql.image.repository = strenv(PG_REPO)
                 | .postgresql.image.digest = strenv(PG_DIGEST)
                 | .repositorySync.revision = strenv(REV)
                 | .bootstrap.approvedRevision = strenv(REV)' envs/staging/values.yaml
            git diff --quiet && { echo "staging already pinned to ${GITHUB_SHA::9}"; exit 0; }
            # Forward only: a re-run of an OLD workflow run must not roll staging back.
            cur="$(git show origin/main:envs/staging/values.yaml | yq -r '.repositorySync.revision')"
            if [ -n "$cur" ] && [ "$cur" != null ] && ! git merge-base --is-ancestor "$cur" "$GITHUB_SHA"; then
              echo "::error::staging is pinned to ${cur::9}, which is not an ancestor of ${GITHUB_SHA::9}. Refusing to move staging backwards."
              exit 1
            fi
            git commit -q -am "staging: pin ${GITHUB_SHA::9} [skip ci]"
            if agit push -q "$remote" HEAD:refs/heads/main; then
              echo "staging pinned: image ${IMG_DIGEST::19}, knowledge ${GITHUB_SHA::9}"; exit 0
            fi
            echo "push raced with another commit (attempt $attempt); retrying"; sleep 5
          done
          echo "::error::could not push the staging pin"; exit 1
