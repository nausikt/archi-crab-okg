# main — after merge. Full knowledge e2e on a GitHub-hosted runner (2 PUBLIC
# repos + public releases.map: zero CERN credentials), then the bot pins the
# merge sha into envs/staging. Argo CD auto-syncs staging; PostSync re-runs smoke.sh.
# Engine changes never come through here: build.yaml -> engine-bump PR -> ci.
name: main
on:
  push:
    branches: [main]
    paths: [okg/**, helm/**, scripts/**, envs/**, .github/workflows/main.yaml]
  workflow_dispatch: {}
permissions: {}
concurrency: {group: main, cancel-in-progress: false}
jobs:
  pins:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions: {contents: read}
    outputs:
      okg: ${{ steps.p.outputs.okg }}
      pg: ${{ steps.p.outputs.pg }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        run: |
          echo "okg=$(yq '.images.okg.repository + "@" + .images.okg.digest' envs/staging/values.yaml)" >> "$GITHUB_OUTPUT"
          echo "pg=$(yq '.postgresql.image.repository + "@" + .postgresql.image.digest' envs/staging/values.yaml)" >> "$GITHUB_OUTPUT"
  e2e-smoke:
    # Host-run, NOT a `container:` job: the okg image runs as uid 10001, which
    # cannot write the runner's workspace (checkout EACCES -> every step skipped),
    # and a `services:` Postgres cannot take the chart's command args
    # (max_locks_per_transaction=1024, shared_preload_libraries).
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {contents: read}
    env:
      OKG_IMG: ${{ needs.pins.outputs.okg }}
      PG_IMG: ${{ needs.pins.outputs.pg }}
      OKG_DSN: postgresql://postgres:ci@127.0.0.1:5432/okg
      OKG_DEPLOYMENTS_DIR: ${{ github.workspace }}/okg
      OKG_ENVIRONMENT_DATA_ROOT: ${{ github.workspace }}/.okg-data
      ARCHI_DATA_ROOT: ${{ github.workspace }}/.okg-data
      # The chart's commonEnv (helm/okg/templates/_helpers.tpl -> ConfigMap). The image has
      # no okg git checkout; its release identity is the baked OKG_CODE_REVISION, and okg is
      # forbidden from *inferring* it runs in a container -- the chart DECLARES it via these.
      OKG_RUNTIME_ENVIRONMENT: kubernetes
      OKG_RUNTIME_SUPERVISOR: container
      OKG_DEPLOYMENT: archi-crab
      OKG_NOMOS_SUBJECT: archi-crab-runtime
      OKG_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - name: ghcr login (CLI; no additional action)
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u nausikt --password-stdin
      - name: Postgres with the chart's exact args
        run: |
          docker run -d --name pg --network host --shm-size 2g \
            -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=okg "$PG_IMG" \
            postgres -c shared_preload_libraries=timescaledb,pg_textsearch -c max_locks_per_transaction=1024
          for i in $(seq 1 60); do docker exec pg pg_isready -h 127.0.0.1 -U postgres -d okg >/dev/null 2>&1 && break || sleep 2; done
          # Fresh database on the okg-postgres image: only timescaledb is installed by
          # initdb. okg migrate CHECKS the rest and refuses (extension_missing) — same
          # as bundle README step 4. Create them once, idempotently.
          docker exec pg psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U postgres -d okg \
            -c "CREATE EXTENSION IF NOT EXISTS btree_gist" \
            -c "CREATE EXTENSION IF NOT EXISTS fuzzystrmatch" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_textsearch" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm" \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb" \
            -c "CREATE EXTENSION IF NOT EXISTS vector"
          docker exec pg psql -h 127.0.0.1 -U postgres -d okg -c "SELECT extname, extversion FROM pg_extension ORDER BY 1"
          docker exec pg psql -h 127.0.0.1 -U postgres -d okg -c "SHOW max_locks_per_transaction" -c "SHOW shared_preload_libraries"
      - name: okg wrapper (runs as the runner uid so workspace files stay writable)
        run: |
          mkdir -p "$OKG_ENVIRONMENT_DATA_ROOT/repos" "$ARCHI_DATA_ROOT/data/cmssw-releases" .okg-home .bin
          cat > .bin/okg <<'EOF'
          #!/usr/bin/env bash
          exec docker run --rm --network host --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" -e HOME="$GITHUB_WORKSPACE/.okg-home" \
            -e OKG_DSN -e OKG_DEPLOYMENTS_DIR -e OKG_ENVIRONMENT_DATA_ROOT -e ARCHI_DATA_ROOT \
            -e OKG_RUNTIME_ENVIRONMENT -e OKG_RUNTIME_SUPERVISOR -e OKG_DEPLOYMENT -e OKG_NOMOS_SUBJECT -e OKG_REPO_ROOT -e OKG_MCP_AUTH_TOKEN \
            --entrypoint okg "$OKG_IMG" "$@"
          EOF
          chmod +x .bin/okg && echo "$GITHUB_WORKSPACE/.bin" >> "$GITHUB_PATH"
      - run: okg --help >/dev/null
      - run: okg migrate --deployment archi-crab --apply
      - run: okg catalog ownership claim --deployment "$OKG_DEPLOYMENTS_DIR/archi-crab"
      - run: okg catalog load --deployment "$OKG_DEPLOYMENTS_DIR/archi-crab" --apply
      - run: okg deployment lint archi-crab
      # runtime.enabled: true (correct for the chart) makes plain `okg ingest` ENQUEUE to
      # the runtime worker's DBOS queue, which does not exist here. --inline is the
      # in-process path. The chart-path job below exercises the worker path instead.
      - run: okg ingest --deployment archi-crab --progress --inline
      - run: okg runtime bootstrap --deployment archi-crab --json
      - run: bash scripts/smoke.sh
      - if: always()
        run: docker logs pg --tail 80
  chart-path:
    # THE CHART'S BOOTSTRAP, VERBATIM. The Argo CD path is: init `bootstrap` =
    # `okg provision --publish-once --source-workers N --json`, then init
    # `runtime-bootstrap` = `okg runtime bootstrap`, then the MAIN container
    # `okg runtime worker` — which performs the publish — gated by its startup
    # probe `okg deployment ready <dep> --profile <p> --json` (30s x 60). This job
    # runs exactly that sequence on a PRISTINE database — no manual CREATE
    # EXTENSION — i.e. the state a fresh PVC gives the cluster. Red here = the
    # chart would be red in-cluster:
    #   extension_missing  -> provision does not create extensions -> chart delta 6
    #                         (initdb ConfigMap) is REQUIRED; mirror it in this job.
    #   auth error         -> app_rw/app_ro NOLOGIN -> chart delta 4.
    #   dbos enqueue error -> provision is not in-process on this deployment; the
    #                         chart's init ordering is unsound -> upstream question.
    #   probe never green  -> the worker does not publish; kubelet would restart the
    #                         pod forever -> read worker.log, then upstream question.
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {contents: read}
    env:
      OKG_IMG: ${{ needs.pins.outputs.okg }}
      PG_IMG: ${{ needs.pins.outputs.pg }}
      OKG_DSN: postgresql://postgres:ci@127.0.0.1:5432/okg
      OKG_DEPLOYMENTS_DIR: ${{ github.workspace }}/okg
      OKG_ENVIRONMENT_DATA_ROOT: ${{ github.workspace }}/.okg-data
      ARCHI_DATA_ROOT: ${{ github.workspace }}/.okg-data
      # The chart's commonEnv (helm/okg/templates/_helpers.tpl -> ConfigMap). The image has
      # no okg git checkout; its release identity is the baked OKG_CODE_REVISION, and okg is
      # forbidden from *inferring* it runs in a container -- the chart DECLARES it via these.
      OKG_RUNTIME_ENVIRONMENT: kubernetes
      OKG_RUNTIME_SUPERVISOR: container
      OKG_DEPLOYMENT: archi-crab
      OKG_NOMOS_SUBJECT: archi-crab-runtime
      OKG_REPO_ROOT: ${{ github.workspace }}
      SOURCE_WORKERS: "2" # == values.yaml bootstrap.sourceWorkers
    steps:
      - uses: actions/checkout@v7
      - name: chart-path mirrors the chart (fail on drift)
        run: |
          t=helm/okg/templates/runtime-statefulset.yaml
          grep -q -- '- provision' "$t" && grep -q -- '--publish-once' "$t" \
            && grep -q -- '--source-workers' "$t" && grep -q -B1 -- '- bootstrap$' "$t" \
            && grep -q -- '- worker$' "$t" && grep -q -- '- ready$' "$t" \
            || { echo "::error::helm/okg runtime-statefulset.yaml no longer runs provision/--publish-once/runtime bootstrap/runtime worker/deployment ready — update chart-path"; exit 1; }
          # Every OKG_* env the chart's helpers inject must be one the wrapper passes (below).
          want=$(grep -oE '^- name: OKG_[A-Z_]+' helm/okg/templates/_helpers.tpl | sed 's/- name: //' | sort -u)
          have="OKG_DSN OKG_MCP_RO_DSN OKG_DEPLOYMENTS_DIR OKG_ENVIRONMENT_DATA_ROOT OKG_RUNTIME_ENVIRONMENT OKG_RUNTIME_SUPERVISOR OKG_DEPLOYMENT OKG_NOMOS_SUBJECT OKG_REPO_ROOT"
          missing=$(comm -23 <(echo "$want") <(tr ' ' '\n' <<<"$have" | sort -u))
          [ -z "$missing" ] || { echo "::error::_helpers.tpl injects env the CI wrapper does not pass: $missing"; exit 1; }
      - name: ghcr login (CLI; no additional action)
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u nausikt --password-stdin
      - name: "Postgres exactly as the chart runs it (pristine, NO manual extensions)"
        run: |
          docker run -d --name pg --network host --shm-size 2g \
            -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=okg "$PG_IMG" \
            postgres -c shared_preload_libraries=timescaledb,pg_textsearch -c max_locks_per_transaction=1024
          for i in $(seq 1 60); do docker exec pg pg_isready -h 127.0.0.1 -U postgres -d okg >/dev/null 2>&1 && break || sleep 2; done
          docker exec pg psql -h 127.0.0.1 -U postgres -d okg -c "SELECT extname FROM pg_extension ORDER BY 1"
      - name: okg wrapper (runs as the runner uid so workspace files stay writable)
        run: |
          mkdir -p "$OKG_ENVIRONMENT_DATA_ROOT/repos" "$ARCHI_DATA_ROOT/data/cmssw-releases" .okg-home .bin
          cat > .bin/okg <<'EOF'
          #!/usr/bin/env bash
          exec docker run --rm --network host --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" -e HOME="$GITHUB_WORKSPACE/.okg-home" \
            -e OKG_DSN -e OKG_DEPLOYMENTS_DIR -e OKG_ENVIRONMENT_DATA_ROOT -e ARCHI_DATA_ROOT \
            -e OKG_RUNTIME_ENVIRONMENT -e OKG_RUNTIME_SUPERVISOR -e OKG_DEPLOYMENT -e OKG_NOMOS_SUBJECT -e OKG_REPO_ROOT -e OKG_MCP_AUTH_TOKEN \
            --entrypoint okg "$OKG_IMG" "$@"
          EOF
          chmod +x .bin/okg && echo "$GITHUB_WORKSPACE/.bin" >> "$GITHUB_PATH"
      - name: "init bootstrap == okg provision --publish-once"
        run: okg provision --deployment archi-crab --publish-once --source-workers "$SOURCE_WORKERS" --json | tee provision.json
      - name: "init runtime-bootstrap == okg runtime bootstrap"
        run: okg runtime bootstrap --deployment archi-crab --json
      - name: "main container == okg runtime worker (background, named so we can read its logs)"
        run: |
          docker run -d --name worker --network host --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" -e HOME="$GITHUB_WORKSPACE/.okg-home" \
            -e OKG_DSN -e OKG_DEPLOYMENTS_DIR -e OKG_ENVIRONMENT_DATA_ROOT -e ARCHI_DATA_ROOT \
            -e OKG_RUNTIME_ENVIRONMENT -e OKG_RUNTIME_SUPERVISOR -e OKG_DEPLOYMENT -e OKG_NOMOS_SUBJECT -e OKG_REPO_ROOT -e OKG_MCP_AUTH_TOKEN \
            --entrypoint okg "$OKG_IMG" runtime worker --deployment archi-crab
      - name: "init mcp-role == ALTER ROLE okg_mcp LOGIN"
        run: docker exec pg psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U postgres -d okg -c "ALTER ROLE okg_mcp LOGIN PASSWORD 'okg_mcp'"
      - name: "init deployment-apply == okg deployment apply (source supervision + worker ack)"
        run: |
          # dry-run emits the plan id; --apply requires --confirm <plan-id>
          okg deployment apply archi-crab --json > plan.json
          PLAN=$(python3 -c "import json;print(json.load(open('plan.json'))['plan_id'])")
          echo "plan: $PLAN"
          okg deployment apply archi-crab --apply --confirm "$PLAN" --worker-ack-timeout-seconds 120 --json
      - name: "startup probe == okg deployment ready archi-crab --profile general --json (30s x 60, as kubelet)"
        run: |
          for i in $(seq 1 60); do
            if okg deployment ready archi-crab --profile general --json > ready.json \
               && python3 -c "import json,sys; sys.exit(0 if json.load(open('ready.json')).get('ok') is True else 1)"; then
              echo "ready after $i probe(s)"; cat ready.json; exit 0
            fi
            [ "$(docker inspect -f '{{.State.Running}}' worker)" = "true" ] || { echo "::error::worker exited"; docker logs worker --tail 80; exit 1; }
            sleep 30
          done
          echo "::error::worker never published within the startup budget (kubelet would restart the pod)"
          cat ready.json; docker logs worker --tail 80; exit 1
      - name: "read-back proof (asserts STATUS; provision, like install, may exit 0 on a failed publish)"
        run: bash scripts/smoke.sh
      - if: always()
        run: |
          echo "== worker log"; docker logs worker --tail 80 2>/dev/null || true
          docker stop worker >/dev/null 2>&1 || true
          echo "== postgres log"; docker logs pg --tail 40
  bump-staging:
    needs: [e2e-smoke, chart-path]
    runs-on: ubuntu-latest
    environment: staging
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v7
        with: {token: "${{ secrets.STAGING_BUMP_TOKEN }}"}
      - run: |
          yq -i '.repositorySync.revision = "${{ github.sha }}"
               | .bootstrap.approvedRevision = "${{ github.sha }}"' envs/staging/values.yaml
          git config user.name archi-crab-bot
          git config user.email archi-crab-bot@users.noreply.github.com
          git diff --quiet || { git commit -am "staging: pin ${GITHUB_SHA::9} [skip ci]"; git push; }
