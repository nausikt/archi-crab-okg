# v2/versions.lock -- the ONE file that says which archi v2 the benchmark fixture runs.
# Same role as the repository's versions.lock for the okg engine (docs/UPSTREAM-SYNC.md):
#
#   WRITTEN BY  v2-engine.yaml (daily, branch v2/upstream): archi.*, base.*, images.*.
#               By hand you edit only what is FOLLOWED: archi.repository, archi.branch.
#   READ BY     v2-smoke.yaml  which images a PR is tested with (pulled when images.inputs
#                              matches the tree, built locally otherwise)
#               v2-main.yaml   what gets pinned into v2/envs/bench after a green smoke
#               v2-build.yaml  build args (base-ref, archi.commit, the baked model)
#
# Fingerprints (v2/scripts/lock.sh): base.inputs / images.inputs say what the digests were
# built from; a workflow rebuilds when the tree no longer matches.
archi: # archi-physics/archi `main`: the v2 data-manager, tools and config templates
  repository: https://github.com/archi-physics/archi
  branch: main
  commit: 3c889e0258e2fae638160fe4eacf99d08b687d73 # main, 2026-10-04 (PR #608 merge)
  version: "1.2.4" # pyproject.toml at that commit
base: # OURS (ADR-V2-10): python:3.10 + archi's base requirements at archi.commit, v2/docker/Dockerfile.base
  ref: ghcr.io/nausikt/archi-v2-python-base
  digest: "sha256:8d0c7b34a919bb2f24b411317e58edee9748ac282d69999dcd6edc201388403d" # written by v2-build / v2-engine
  inputs: "ab21ed3376e3e7f173737247e59d1977236cfbf72df9a42efffcbf879b66a46d" # lock.sh base-inputs at build time
images: # OURS, from base + archi.commit + v2/docker, v2/mcp (v2/docker/Dockerfile)
  data-manager:
    ref: ghcr.io/nausikt/archi-v2-data-manager
    digest: "sha256:0aac73e8f9a0110275fe9bf62d5c5c33af78170f4c5674c32d90529796fa9b67"
  mcp:
    ref: ghcr.io/nausikt/archi-v2-mcp
    digest: "sha256:2b6ec7a6ae9db4a9d89620cfc6a808dbc125df6b8f1c7581ebb0fa81bd26186c"
  postgres:
    ref: ghcr.io/nausikt/archi-v2-postgres
    digest: "sha256:29801186fa891c695d039156218be7e76dbf3f21a0f187b1c93e40395025791b"
  inputs: "f3316ed511bb988436954a46968772395c1c822113711d483b9e633c06f09d5d" # lock.sh images-inputs at build time
  built_from: "1e64643293597ece07ed55919c106ddf4b83e8e6" # this repository's commit the images were built from
