# envs/staging — overrides only. Namespace: archi-crab-staging (set on the Argo CD Application).
#
# This file says what staging RUNS. The four pin lines are written by the bot, never by
# hand, in ONE commit after main's e2e is green (main.yaml, "staging: pin <sha>"):
#   ENGINE    images.okg.* / postgresql.image.*      <- copied from versions.lock
#   KNOWLEDGE repositorySync.revision / bootstrap.approvedRevision   <- the tested sha
# To change the engine, merge the `engine` workflow's pull request; CI reads
# versions.lock (not this file) to pick the image it tests.
fullnameOverride: archi-crab-okg-staging
okg:
  readinessProfile: "" # okg v4 (dev >= 3d6cb3e8) has no `deployment ready --profile`; run1 (v3) keeps it
images:
  okg:
    repository: ghcr.io/nausikt/archi-crab-okg
    tag: ""
    digest: "sha256:edfe5cad544636ec725354de3e410b59b9c0c7bc91ddc62aad9de5012957fbec"
    pullPolicy: IfNotPresent
postgresql:
  image:
    repository: ghcr.io/mitdbg/okg-postgres
    tag: ""
    digest: "sha256:b6cd6a0d74789d45c2c208f2e9c8522e0c1120841a51f8f7f17e74fc7a1f9e88"
    pullPolicy: IfNotPresent
  storage:
    size: 150Gi
    storageClassName: cinder-io1-delete # real StorageClass on the target cluster (Runbook Phase 2)
runtime:
  storage:
    size: 75Gi
    storageClassName: cinder-io1-delete
repositorySync:
  revision: "43f459c6bceac6bd26376d8d1db5a89fdd697da1" # <- merge sha (staging: CI bot; prod: Promote PR)
bootstrap:
  approvedRevision: "43f459c6bceac6bd26376d8d1db5a89fdd697da1" # <- MUST equal repositorySync.revision (chart enforces)
mcp:
  allowedHosts:
    - "archi-crab-okg-staging.cern.ch"
    - "archi-crab-okg-staging.cern.ch:*"
    - "10.254.109.91:*"
frozen:
  enabled: true   # bench window; set false after (RUN1-FREEZE A3)
