# versions.lock — the ONE file that says which engine this repo is validated with.
#
#   WRITTEN BY  the `engine` workflow (daily), on branch engine/upstream. By hand you
#               edit only WHAT IS FOLLOWED: upstream.track, archi.repository, archi.branch.
#   READ BY     ci.yaml + e2e.yaml  which image a PR is tested with   (runtime.ref@digest)
#               main.yaml           what gets pinned into envs/staging after a green e2e
#               engine.yaml         build args for docker/runtime/Dockerfile
#
# envs/staging/values.yaml is NOT an input any more: it is what staging RUNS, written by
# the bot in one commit (image + knowledge revision together) after main's e2e is green.
#
# Two upstreams are followed. Everything else is derived from them.
upstream: # okg — the engine (private repository, private images)
  repository: https://github.com/mitdbg/okg
  image: ghcr.io/mitdbg/okg
  postgres_image: ghcr.io/mitdbg/okg-postgres
  # The branch AND the image tag that is followed. okg publishes <image>:dev and
  # <image>:sha-<commit> for the tip of `dev` after every merge.
  track: dev
  # Read from the image (label org.opencontainers.image.revision), never chosen by hand.
  commit: f0e11130f4b088a659236ad13ac787623190fb70
images:
  okg:
    ref: ghcr.io/mitdbg/okg@sha256:67341ca2e0de97fd29c425c3e15ed58a63b6524801eca43082d88cc74e1701aa
  okg-postgres:
    ref: ghcr.io/mitdbg/okg-postgres@sha256:b0d72023d9c911881271a18cf2f7c65e7d19b7c642ce288fe2b5a8c0e9cf82d6
archi: # archi-okg — the HEP distribution (public): connectors, bundle, schemas, skills
  repository: https://github.com/archi-physics/archi-okg
  branch: main # archi-okg has no `dev`; merges land on main
  commit: 1bb7e7038ed2ef9a17939e216aaaa21f58c18293
runtime: # OUR image = okg base + archi. Every line below is written by engine.yaml.
  ref: ghcr.io/nausikt/archi-crab-okg
  digest: sha256:eac85cb338e81049edca79d2bd353a9a20d735dfa09992e28cfd0b80a6e100c7
  built_from: bb791722631cee9e7aa0dbf80036baa977b03991
  base_user: "10001:10001" # the base image's USER, read from its config
  # Fingerprints of what `digest` was built from (scripts/engine-lock.sh). CI fails when
  # `inputs` no longer matches the pins above: someone moved a pin without rebuilding.
  inputs: d6f857d13abdcfabb6912d3439f42d852032d67b0b1634e69b8e533b7f46bbb9
  dockerfile: 42f24c886ed2e9b2797042a73801593403d5f7f45cb509030bf032785fe3c5a5
