# v2/envs/bench -- the ONE environment the archi-v2 fixture runs in (namespace archi-crab-staging,
# next to the okg staging instance and the ToolHive operator). Overrides only.
# The three image lines are written by the bot (v2-main.yaml) after a green smoke on main,
# from v2/versions.lock; by hand only in runbook phase 2. Never a tag.
images:
  dataManager: {repository: ghcr.io/nausikt/archi-v2-data-manager, digest: ""}   # <- bot
  mcp:         {repository: ghcr.io/nausikt/archi-v2-mcp,          digest: ""}   # <- bot
  postgres:    {repository: ghcr.io/nausikt/archi-v2-postgres,     digest: ""}   # <- bot
secrets:
  existingSecret: archi-v2          # kubectl -n archi-crab-staging create secret generic archi-v2 ... (runbook 2.2)
postgres:
  storage: {size: 50Gi, storageClassName: cinder-io1-delete}   # the same class the okg chart uses on this cluster
dataManager:
  storage: {size: 20Gi, storageClassName: cinder-io1-delete}
mcp:
  # phase 2: sidecar (in-cluster, bearer, port-forward) until the two hostnames exist on the
  # Gateway; phase 4 flips this ONE line to `toolhive` (CERN SSO through ToolHive vMCPs).
  mode: sidecar
  host: archi-crab-v2.cern.ch   # the ONE alias; /grep/mcp and /vectorstore/mcp (chart defaults)
cern:
  audience: crab-mcp-gateway-public-staging   # the public client of the gateway release in this namespace; no new CERN app
gateway: {name: archi-crab, namespace: archi-crab-gw, timeout: 3600s}
